[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agraria-frete"
version = "0.1.0"
description = "Diagnóstico, previsão e simulação de custos de frete"
requires-python = ">=3.9"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "joblib>=1.4,<2", "scipy>=1.11,<2", "streamlit>=1.40,<2", "qrcode[pil]>=8.2,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pypdf>=5,<7"]
docs = ["reportlab>=4,<5", "pypdf>=5,<7"]
render = ["pypdfium2>=4,<6", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
